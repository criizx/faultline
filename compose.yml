services:
  faultline:
    build: .
    entrypoint: ["/bin/sh", "/runtime/docker-entrypoint.sh"]
    environment:
      FAULTLINE_EXPERIMENT_ID: ${FAULTLINE_EXPERIMENT_ID:-local-compose}
      FAULTLINE_UPSTREAM_HOST: ${FAULTLINE_UPSTREAM_HOST:-host.docker.internal}
      FAULTLINE_UPSTREAM_PORT: ${FAULTLINE_UPSTREAM_PORT:-3000}
      FAULTLINE_UPSTREAM_LATENCY_MS: ${FAULTLINE_UPSTREAM_LATENCY_MS:-0}
      FAULTLINE_UPSTREAM_JITTER_MS: ${FAULTLINE_UPSTREAM_JITTER_MS:-0}
      FAULTLINE_UPSTREAM_BANDWIDTH_KBPS: ${FAULTLINE_UPSTREAM_BANDWIDTH_KBPS:-0}
      FAULTLINE_DOWNSTREAM_LATENCY_MS: ${FAULTLINE_DOWNSTREAM_LATENCY_MS:-0}
      FAULTLINE_DOWNSTREAM_JITTER_MS: ${FAULTLINE_DOWNSTREAM_JITTER_MS:-0}
      FAULTLINE_DOWNSTREAM_BANDWIDTH_KBPS: ${FAULTLINE_DOWNSTREAM_BANDWIDTH_KBPS:-0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./scripts/docker-entrypoint.sh:/runtime/docker-entrypoint.sh:ro

  ui:
    image: nginx:1.27-alpine
    depends_on:
      - faultline
    ports:
      - "127.0.0.1:4173:80"
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./demo/runtime-config.js:/usr/share/nginx/html/runtime-config.js:ro
